<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Weather Time Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header">
    <p class="eyebrow">☁ open-meteo &middot; no api key required</p>
    <h1>Weather Time Machine</h1>
    <p class="tagline">Type a city. See today's sky — then see this same date, every year back.</p>
  </header>

  <main>
    <form id="search-form" class="search-bar" autocomplete="off">
      <input id="city-input" type="text" placeholder="Try “Jaipur” or “Lisbon”…" required />
      <button type="submit">Look up</button>
    </form>

    <p id="status" class="status"></p>

    <section id="result" class="result hidden">

      <div class="today-card">
        <div class="today-left">
          <p class="place-label" id="place-name">—</p>
          <p class="today-date" id="today-date">—</p>
          <p class="temp-big"><span id="today-temp">—</span>°C</p>
          <p class="today-desc" id="today-desc">—</p>
        </div>
        <div class="today-right">
          <dl class="stat-grid">
            <div><dt>Feels like</dt><dd id="today-feels">—°</dd></div>
            <div><dt>Wind</dt><dd id="today-wind">—</dd></div>
            <div><dt>Humidity</dt><dd id="today-humidity">—</dd></div>
          </dl>
        </div>
      </div>

      <div class="history-panel">
        <p class="panel-label">This date, back through the years</p>
        <div id="chart" class="chart" aria-live="polite"></div>
        <p class="panel-note" id="history-note"></p>
      </div>

    </section>
  </main>

  <footer class="site-footer">
    <p>Weather data: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>. Built as a demo for GitHub.</p>
  </footer>

<script src="script.js"></script>
</body>
</html>
